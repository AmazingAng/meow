# Generate Meow.xcodeproj with: xcodegen generate
name: Meow
options:
  bundleIdPrefix: blue.meow
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: JY32YTS7GQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "26"
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Meow:
    type: application
    platform: iOS
    sources:
      - Meow
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: blue.meow.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Meow/Info.plist
      properties:
        CFBundleDisplayName: Meow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, zh-Hans]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Meow uses Face ID to confirm approvals.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true # lets a development build talk to http://127.0.0.1
        ITSAppUsesNonExemptEncryption: false
        # Official server suggested on first launch; saved self-hosted servers take precedence.
        MeowDefaultServer: "https://api.meow.blue"
    entitlements:
      path: Meow/Meow.entitlements
      properties:
        aps-environment: development # Xcode switches this to production when exporting for distribution
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups: [group.blue.meow.app]
    dependencies:
      - target: MeowNotificationService
    scheme:
      testTargets: [MeowTests, MeowUITests]
  MeowNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
      - Shared
      - Meow/Resources/Localizable.xcstrings
      - Meow/Resources/Sounds/meow.wav
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: blue.meow.app.NotificationService
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: NotificationService/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleDisplayName: Meow Notification Service
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.blue.meow.app]
  MeowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MeowTests
      - path: ../contracts/fixtures/notifications.json
        buildPhase: resources
    dependencies:
      - target: Meow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: blue.meow.app.tests
  MeowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MeowUITests
    dependencies:
      - target: Meow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: blue.meow.app.uitests
        TEST_TARGET_NAME: Meow
