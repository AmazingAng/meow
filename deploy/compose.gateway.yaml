# Operator only: merge with compose.yaml. Keep APNs credentials on this host.
# docker compose -p meow-gateway -f compose.yaml -f compose.gateway.yaml up -d
services:
  meow:
    command: ["gateway"]
    environment:
      MEOW_DB: /data/gateway.db
      MEOW_GATEWAY_MAX_CONCURRENT_PUSHES: ${MEOW_GATEWAY_MAX_CONCURRENT_PUSHES:-0}
